
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set up my password</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 420px;
            margin: 60px auto;
            padding: 20px;
        }

        label, input, button {
            display: block;
            width: 100%;
            box-sizing: border-box;
        }

        input, button {
            margin-top: 8px;
            margin-bottom: 18px;
            padding: 12px;
        }

        button {
            cursor: pointer;
        }

        #message {
            overflow-wrap: anywhere;
        }
    </style>
</head>
<body>
<h1>Set up my password</h1>
<p>Choose a new password for your account.</p>

<form id="password-form">
    <label for="password">New Password</label>
    <input
            id="password"
            type="password"
            minlength="12"
            maxlength="128"
            autocomplete="new-password"
            required
    >

    <label for="confirmPassword">Confirm password</label>
    <input
            id="confirmPassword"
            type="password"
            minlength="12"
            maxlength="128"
            autocomplete="new-password"
            required
    >

    <button id="submit-button" type="submit">
        Set up my password
    </button>
</form>

<p id="message" role="status"></p>

<script>
    const API_BASE_URL = "https://localhost:8443";

    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");

    const form = document.getElementById("password-form");
    const message = document.getElementById("message");
    const submitButton = document.getElementById("submit-button");

    if (!code) {
        form.hidden = true;
        message.textContent =
            "Invalid link: the configuration code is missing.";
    }

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const password = document.getElementById("password").value;
        const confirmPassword =
            document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {
            message.textContent = "The passwords do not match.";
            return;
        }

        submitButton.disabled = true;
        message.textContent = "Configuration in progress...";

        try {
            const response = await fetch(
                `${API_BASE_URL}/auth/password-setup/confirm`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ code, password })
                }
            );

            const result = await response.json().catch(() => ({}));

            if (!response.ok) {
                throw new Error(
                    result.message || "The link is invalid or has expired."
                );
            }

            form.hidden = true;
            message.textContent =
                result.message || "Your password has been successfully set up.";

            // Retirer le code de l'URL après la réussite.
            window.history.replaceState(
                {},
                document.title,
                window.location.pathname
            );

        } catch (error) {
            message.textContent =
                error.message || "Unable to set the password.";
        } finally {
            submitButton.disabled = false;
        }
    });
</script>
</body>
</html>
