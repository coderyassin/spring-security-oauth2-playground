server:
  port: 8443
  http:
    port: 8080
  ssl:
    enabled: true
    certificate: ${SSL_CERTIFICATE:classpath:localhost+1.pem}
    certificate-private-key: ${SSL_PRIVATE_KEY:classpath:localhost+1-key.pem}
  servlet:
    session:
      timeout: 20m

spring:
  application:
    name: springsecsection1

  datasource:
    url: ${DB_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driverClassName: org.h2.Driver
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    generate-unique-name: false

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

          spring-sec-section1:
            provider: keycloak
            client-id: ${KEYCLOAK_SPRINGSECSECTION1_CLIENT_ID}
            client-secret: ${KEYCLOAK_SPRINGSECSECTION1_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

          keycloak:
            provider: keycloak
            client-id: ${KEYCLOAK_CLIENT_ID}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

          keycloak-app-a:
            provider: keycloak
            client-id: ${KEYCLOAK_APP_A_CLIENT_ID}
            client-secret: ${KEYCLOAK_APP_A_SECRET}
            authorization-grant-type: authorization_code
            scope:
              - openid
              - profile
              - email

          keycloak-app-b:
            provider: keycloak
            client-id: ${KEYCLOAK_APP_B_CLIENT_ID}
            client-secret: ${KEYCLOAK_APP_B_SECRET}
            authorization-grant-type: authorization_code
            scope:
              - openid
              - profile
              - email

        provider:
          google:
            issuer-uri: ${GOOGLE_ISSUER:https://accounts.google.com}
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:9090/realms/oauth2-playground}

      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:9090/realms/oauth2-playground}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    org.springframework.security: TRACE
    org.springframework.security.web.FilterChainProxy: DEBUG
  pattern:
    console: "[%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

security:
  authorization:
    events:
      publish-granted: false
      publish-denied: true

app:
  oauth2:
    authorized-redirect-uris:
      - http://localhost:4200/
      - https://app.example.com/oauth/callback
      - https://admin.example.com/oauth/callback

  security:
    login:
      max-failed-attempts: 5
      lock-duration: 5m
      failed-attempt-window: 24h

  jwt:
    secret: ${APP_JWT_SECRET}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 2592000000

  cors:
    allowed-origin-patterns:
      - http://localhost:*
      - https://localhost:*
      - http://*.localhost:*
      - https://*.localhost:*

  keycloak:
    clients:
      app-a: keycloak-app-a
      app-b: keycloak-app-b

  frontend-url: ${FRONTEND_URL:http://localhost:4200}

keycloak:
  admin:
    server-url: ${KEYCLOAK_ADMIN_SERVER_URL:http://localhost:9090}
    realm: ${KEYCLOAK_ADMIN_REALM:oauth2-playground}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}

  auth:
    base-url: ${KEYCLOAK_AUTH_BASE_URL:http://localhost:9090}
    realm: ${KEYCLOAK_AUTH_REALM:oauth2-playground}
    client-id: ${KEYCLOAK_AUTH_CLIENT_ID}
    client-secret: ${KEYCLOAK_AUTH_CLIENT_SECRET}
